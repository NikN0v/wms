spring:
  application:
    name: wms

  datasource:
    url: jdbc:postgresql://localhost:5432/wms_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

security:
  jwt:
    secret: ${WMS_JWT_SECRET_BASE64}
    expiration-seconds: 3600
  bootstrap:
    secret: ${WMS_BOOTSTRAP_SECRET:}

server:
  port: 8080
